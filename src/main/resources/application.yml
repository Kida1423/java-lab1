spring:
  application:
    name: spring-lab-01
server:
  port: 9090
app:
  owner: Murzalin Adilet
  group: IT1CCO-2504
  date-pattern: yyyy-MM-dd HH:mm:ss
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  pagination:
    default-size: 20
    max-size: 200
logging:
  level:
    kz.iitu: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: always
